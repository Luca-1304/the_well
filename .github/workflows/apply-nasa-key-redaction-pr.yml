name: Apply NASA response-key redaction from PR

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nasa-response-key-redaction-20260803
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply focused source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path('apps/nasa_data_hub/nasa_data_hub/client.py')
          client = client_path.read_text(encoding='utf-8')

          old_import = 'from urllib.parse import urlencode'
          new_import = 'from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit'
          if old_import not in client:
              raise SystemExit('Expected urllib.parse import not found')
          client = client.replace(old_import, new_import, 1)

          old_decode = '                    payload = json.loads(response.read().decode("utf-8"))'
          new_decode = '''                    payload = _redact_api_keys(
                        json.loads(response.read().decode("utf-8"))
                    )'''
          if old_decode not in client:
              raise SystemExit('Expected response decode line not found')
          client = client.replace(old_decode, new_decode, 1)

          marker = '\n\ndef _expect_dict(value: Any, label: str) -> dict[str, Any]:\n'
          helper = r'''

          def _redact_api_keys(value: Any) -> Any:
              """Remove API credentials echoed inside nested response URLs."""
              if isinstance(value, dict):
                  return {key: _redact_api_keys(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [_redact_api_keys(item) for item in value]
              if isinstance(value, tuple):
                  return tuple(_redact_api_keys(item) for item in value)
              if not isinstance(value, str) or "api_key=" not in value.lower():
                  return value

              try:
                  parts = urlsplit(value)
              except ValueError:
                  return value
              if parts.scheme not in {"http", "https"} or not parts.query:
                  return value

              clean_query = urlencode(
                  [
                      (key, item)
                      for key, item in parse_qsl(parts.query, keep_blank_values=True)
                      if key.lower() != "api_key"
                  ],
                  doseq=True,
              )
              return urlunsplit(
                  (parts.scheme, parts.netloc, parts.path, clean_query, parts.fragment)
              )
          '''
          if marker not in client:
              raise SystemExit('Expected helper insertion marker not found')
          client = client.replace(marker, helper + marker, 1)
          client_path.write_text(client, encoding='utf-8')

          test_path = Path('apps/nasa_data_hub/tests/test_client.py')
          tests = test_path.read_text(encoding='utf-8')
          test_marker = '    def test_retries_429(self):\n'
          regression = r'''    def test_response_links_and_cache_never_expose_key(self):
              payload = {
                  "links": {
                      "self": "https://api.nasa.gov/neo?api_key=top-secret&x=1"
                  },
                  "nested": [
                      "https://api.nasa.gov/neo?x=1&API_KEY=top-secret#fragment"
                  ],
              }
              with tempfile.TemporaryDirectory() as folder:
                  with patch.object(
                      module,
                      "urlopen",
                      lambda request, timeout: FakeResponse(payload),
                  ):
                      result = NASAClient(
                          "top-secret", cache_dir=folder
                      ).neo_feed(date(2026, 8, 2))

                  serialised = json.dumps(result)
                  self.assertNotIn("top-secret", serialised)
                  self.assertNotIn("api_key", serialised.lower())
                  self.assertEqual(
                      result["links"]["self"],
                      "https://api.nasa.gov/neo?x=1",
                  )
                  self.assertEqual(
                      result["nested"][0],
                      "https://api.nasa.gov/neo?x=1#fragment",
                  )
                  cache_files = list(Path(folder).glob("*.json"))
                  self.assertEqual(len(cache_files), 1)
                  cache_text = cache_files[0].read_text(encoding="utf-8")
                  self.assertNotIn("top-secret", cache_text)
                  self.assertNotIn("api_key", cache_text.lower())

          '''
          if test_marker not in tests:
              raise SystemExit('Expected test insertion marker not found')
          tests = tests.replace(test_marker, regression + test_marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Verify NASA Data Hub
        working-directory: apps/nasa_data_hub
        run: |
          python -m compileall -q nasa_data_hub
          python -m unittest discover -s tests -v
      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/apply-nasa-key-redaction.yml
          rm .github/workflows/apply-nasa-key-redaction-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nasa_data_hub/nasa_data_hub/client.py apps/nasa_data_hub/tests/test_client.py .github/workflows/apply-nasa-key-redaction.yml .github/workflows/apply-nasa-key-redaction-pr.yml
          git commit -m "security: redact NASA keys from response payloads"
          git push origin HEAD:fix/nasa-response-key-redaction-20260803
