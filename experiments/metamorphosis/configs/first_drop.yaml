experiment:
  name: first_drop
  stage: infrastructure_validation_2d
  proof_relevance: indirect
  purpose: >-
    Validate the equation residuals, diagnostics, marked-substance metrics, and
    first damping baseline before moving to a genuinely three-dimensional
    vortex-stretching experiment.

lane:
  pure_navier_stokes_baseline: true
  controlled_space_extension: true
  metamorphosis_extensions: false

scaling:
  nondimensional: true
  characteristic_length: 1.0
  characteristic_velocity: 1.0

fluid:
  density: 1.0
  kinematic_viscosity: 0.001
  heat_capacity: 1.0
  thermal_conductivity: 0.001
  scalar_diffusivity: 0.0001
  reference_temperature: 0.0

geometry:
  dimensions: 2
  domain: periodic_square
  domain_length: 6.283185307179586
  boundary_condition: periodic

initial_condition:
  type: taylor_green_vortex
  amplitude: 1.0
  marked_scalar:
    enabled: true
    shape: centred_drop

thermal:
  enabled: false
  exterior_temperature: 0.0
  heat_transfer_coefficient: 0.0

controller:
  enabled: true
  type: vorticity_weighted_damping_baseline
  interpretation: >-
    Diagnostic damping only. A reduced vorticity peak does not count as
    successful redistribution unless meaningful flow survives after the peak.
  safe_vorticity: 10.0
  proportional_gain: 0.1
  max_control_force: 1.0

metrics:
  vorticity_balance_source: governing_equation_norms
  velocity_gradient_norm: pointwise_frobenius_then_supremum
  track:
    - max_velocity_gradient
    - max_vorticity
    - kinetic_energy
    - vortex_stretching_rate
    - viscous_redistribution_rate
    - regulation_ratio
    - marked_scalar_mass_fidelity
    - marked_scalar_soft_overlap
  require_continued_flow_after_peak: true

preservation:
  existence_threshold: 0.90
  threshold_status: provisional
  first_measurable_fields:
    - marked_scalar_mass_fidelity
    - marked_scalar_soft_overlap
  future_purpose_specific_fields:
    - composition
    - information
    - function

validation:
  require_analytic_operator_tests: true
  require_baseline_comparison: true
  require_independent_solver_comparison: true
  allow_pinn_as_only_evidence: false
  two_dimensional_limit: >-
    Vortex stretching is identically zero in 2D. This configuration validates
    infrastructure and cannot establish the central 3D continuation mechanism.

next_experiment:
  dimensions: 3
  boundary_condition: periodic
  requirement: nonzero_vortex_stretching
