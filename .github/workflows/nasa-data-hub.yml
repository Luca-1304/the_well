name: NASA Data Hub

on:
  push:
    paths:
      - "apps/nasa_data_hub/**"
      - ".github/workflows/nasa-data-hub.yml"
  pull_request:
    paths:
      - "apps/nasa_data_hub/**"
      - ".github/workflows/nasa-data-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: apps/nasa_data_hub

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q nasa_data_hub
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
      - name: Verify no-key startup path
        run: python -m nasa_data_hub --env-file /tmp/missing-nasa-env health
      - name: Build standalone package
        run: |
          python -m pip install --upgrade pip build
          python -m build
