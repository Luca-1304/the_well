name: NASA Data Hub Production Smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Structural checks use no NASA quota; full checks all public data families."
        required: true
        default: structural
        type: choice
        options:
          - structural
          - full

permissions:
  contents: read

concurrency:
  group: nasa-data-hub-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'structural' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify production
        run: node scripts/production-smoke.mjs --mode "$SMOKE_MODE"
