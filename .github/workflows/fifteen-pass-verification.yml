name: Fifteen consecutive verification passes

on:
  pull_request:
    paths:
      - ".github/workflows/fifteen-pass-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit
      - name: Run all hooks
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  parent-suite:
    name: Parent suite 15/15 — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install complete repository environment
        run: uv sync --all-extras --dev
      - name: Record parent-suite environment
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            python --version
            uv --version
            echo "PYTHONHASHSEED=${PYTHONHASHSEED-<unset>}"
            echo "TZ=${TZ-<unset>}"
            echo "LC_ALL=${LC_ALL-<unset>}"
          } | tee diagnostics/environment.log
      - name: Run fifteen consecutive complete cycles
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          for pass_number in $(seq 1 15); do
            log_file="diagnostics/parent-pass-${pass_number}.log"
            echo "::group::PARENT PASS ${pass_number}/15 — Python ${{ matrix.python-version }}"
            set +e
            {
              echo "PARENT PASS ${pass_number}/15"
              echo "COMMAND: uv run pytest tests"
              uv run pytest tests
              pytest_status=$?
              echo "PYTEST EXIT STATUS: ${pytest_status}"
              if [ "${pytest_status}" -ne 0 ]; then
                exit "${pytest_status}"
              fi

              echo "COMMAND: uv run python -m the_well.research.metamorphosis.run_analytic_baseline"
              uv run python -m the_well.research.metamorphosis.run_analytic_baseline
              analytic_status=$?
              echo "ANALYTIC EXIT STATUS: ${analytic_status}"
              exit "${analytic_status}"
            } 2>&1 | tee "${log_file}"
            cycle_status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "${cycle_status}" -ne 0 ]; then
              echo "PARENT RESULT — Python ${{ matrix.python-version }}: FAILED ON PASS ${pass_number}/15"
              exit "${cycle_status}"
            fi
          done
          echo "PARENT RESULT — Python ${{ matrix.python-version }}: 15/15 PASSED"
      - name: Upload parent-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parent-suite-diagnostics-python-${{ matrix.python-version }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

  nasa-linux:
    name: NASA clean-package 15/15 — Linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install wheel prerequisites
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel
      - name: Run fifteen consecutive clean-package cycles
        run: python scripts/reliability_gate.py --phase 1 --passes 15

  nasa-windows:
    name: NASA clean-package 15/15 — Windows
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install wheel prerequisites
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel
      - name: Run fifteen consecutive clean-package cycles
        run: python scripts/reliability_gate.py --phase 1 --passes 15
