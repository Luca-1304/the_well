name: NASA integration

on:
  push:
    paths:
      - "integrations/nasa/**"
      - "tests/integrations/test_nasa_client.py"
      - "pyproject.toml"
      - ".github/workflows/nasa-integration.yml"
  pull_request:
    paths:
      - "integrations/nasa/**"
      - "tests/integrations/test_nasa_client.py"
      - "pyproject.toml"
      - ".github/workflows/nasa-integration.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile client
        run: python -m compileall -q integrations/nasa
      - name: Run NASA tests
        run: python -m pytest -q tests/integrations/test_nasa_client.py
