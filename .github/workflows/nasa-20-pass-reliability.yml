name: NASA Data Hub 20-pass reliability

on:
  pull_request:
    paths:
      - "apps/nasa_data_hub/**"
      - ".github/workflows/nasa-20-pass-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-reliability:
    name: Linux 10-pass + 10-pass confirmation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    env:
      NASA_API_KEY: DEMO_KEY
      NASA_TIMEOUT_SECONDS: "30"
      NASA_MAX_RETRIES: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel

      - name: Live upstream preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nasa-live-preflight
          export NASA_CACHE_DIR=/tmp/nasa-live-preflight
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env doctor > /tmp/preflight-doctor.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env apod --date 2025-01-01 > /tmp/preflight-apod.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env neo --start 2025-01-01 --end 2025-01-01 > /tmp/preflight-neo.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env donki FLR --start 2025-01-01 --end 2025-01-02 > /tmp/preflight-donki.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env eonet --status open --limit 2 > /tmp/preflight-eonet.json
          python - <<'PY'
          import json
          from pathlib import Path

          doctor = json.loads(Path('/tmp/preflight-doctor.json').read_text())
          apod = json.loads(Path('/tmp/preflight-apod.json').read_text())
          neo = json.loads(Path('/tmp/preflight-neo.json').read_text())
          donki = json.loads(Path('/tmp/preflight-donki.json').read_text())
          eonet = json.loads(Path('/tmp/preflight-eonet.json').read_text())
          assert doctor['ok'] is True and doctor['live_request'] == 'passed'
          assert apod.get('date') == '2025-01-01' and apod.get('title')
          assert 'near_earth_objects' in neo
          assert isinstance(donki, list)
          assert isinstance(eonet.get('events'), list)
          print('Live preflight for APOD, NEO, DONKI and EONET: passed')
          PY

      - name: Phase 1 — ten complete clean passes
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "========== PHASE 1 PASS ${pass}/10 =========="
            work="/tmp/nasa-phase1-${pass}"
            rm -rf "$work" dist
            python -m compileall -q nasa_data_hub
            python -m unittest discover -s tests -v
            bash -n start.sh
            python -m pip wheel . --no-deps --no-build-isolation -w dist
            python -m venv "$work/venv"
            "$work/venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
            "$work/venv/bin/nasa-data-hub" --env-file /tmp/missing-nasa-env health > "$work/health.json"
            "$work/venv/bin/python" scripts/reliability_probe.py
            python - "$work/health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload['ok'] is True
          assert payload['key_mode'] == 'demo'
          assert payload['using_demo_key'] is True
          PY
            rm -rf "$work" dist
          done
          echo "PHASE 1 RESULT: 10/10 PASSED"

      - name: Live midpoint gate after first ten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nasa-live-midpoint
          export NASA_CACHE_DIR=/tmp/nasa-live-midpoint
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env doctor > /tmp/midpoint-doctor.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env apod --date 2025-01-01 > /tmp/midpoint-apod.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env neo --start 2025-01-01 --end 2025-01-01 > /tmp/midpoint-neo.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env donki FLR --start 2025-01-01 --end 2025-01-02 > /tmp/midpoint-donki.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env eonet --status open --limit 2 > /tmp/midpoint-eonet.json
          python - <<'PY'
          import json
          from pathlib import Path

          doctor = json.loads(Path('/tmp/midpoint-doctor.json').read_text())
          apod = json.loads(Path('/tmp/midpoint-apod.json').read_text())
          neo = json.loads(Path('/tmp/midpoint-neo.json').read_text())
          donki = json.loads(Path('/tmp/midpoint-donki.json').read_text())
          eonet = json.loads(Path('/tmp/midpoint-eonet.json').read_text())
          assert doctor['ok'] is True and doctor['live_request'] == 'passed'
          assert apod.get('date') == '2025-01-01' and apod.get('title')
          assert 'near_earth_objects' in neo
          assert isinstance(donki, list)
          assert isinstance(eonet.get('events'), list)
          print('Live midpoint gate: passed')
          PY

      - name: Phase 2 — ten confirmation passes
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "========== PHASE 2 PASS ${pass}/10 =========="
            work="/tmp/nasa-phase2-${pass}"
            rm -rf "$work" dist
            python -m compileall -q nasa_data_hub
            python -m unittest discover -s tests -v
            bash -n start.sh
            python -m pip wheel . --no-deps --no-build-isolation -w dist
            python -m venv "$work/venv"
            "$work/venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
            "$work/venv/bin/nasa-data-hub" --env-file /tmp/missing-nasa-env health > "$work/health.json"
            "$work/venv/bin/python" scripts/reliability_probe.py
            python - "$work/health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload['ok'] is True
          assert payload['key_mode'] == 'demo'
          assert payload['using_demo_key'] is True
          PY
            rm -rf "$work" dist
          done
          echo "PHASE 2 RESULT: 10/10 PASSED"

      - name: Live postflight confirmation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nasa-live-postflight
          export NASA_CACHE_DIR=/tmp/nasa-live-postflight
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env doctor > /tmp/postflight-doctor.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env apod --date 2025-01-01 > /tmp/postflight-apod.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env neo --start 2025-01-01 --end 2025-01-01 > /tmp/postflight-neo.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env donki FLR --start 2025-01-01 --end 2025-01-02 > /tmp/postflight-donki.json
          python -m nasa_data_hub --env-file /tmp/missing-nasa-env eonet --status open --limit 2 > /tmp/postflight-eonet.json
          python - <<'PY'
          import json
          from pathlib import Path

          doctor = json.loads(Path('/tmp/postflight-doctor.json').read_text())
          apod = json.loads(Path('/tmp/postflight-apod.json').read_text())
          neo = json.loads(Path('/tmp/postflight-neo.json').read_text())
          donki = json.loads(Path('/tmp/postflight-donki.json').read_text())
          eonet = json.loads(Path('/tmp/postflight-eonet.json').read_text())
          assert doctor['ok'] is True and doctor['live_request'] == 'passed'
          assert apod.get('date') == '2025-01-01' and apod.get('title')
          assert 'near_earth_objects' in neo
          assert isinstance(donki, list)
          assert isinstance(eonet.get('events'), list)
          print('Live postflight confirmation: passed')
          PY

  windows-reliability:
    name: Windows 10-pass + 10-pass confirmation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    env:
      NASA_API_KEY: DEMO_KEY

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel

      - name: Phase 1 — ten complete clean Windows passes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          1..10 | ForEach-Object {
            $pass = $_
            Write-Host "========== WINDOWS PHASE 1 PASS $pass/10 =========="
            $work = Join-Path $env:TEMP "nasa-win-phase1-$pass"
            Remove-Item $work, .\dist -Recurse -Force -ErrorAction SilentlyContinue
            python -m compileall -q nasa_data_hub
            python -m unittest discover -s tests -v
            [void][scriptblock]::Create((Get-Content .\start.ps1 -Raw))
            python -m pip wheel . --no-deps --no-build-isolation -w dist
            python -m venv "$work\venv"
            $python = "$work\venv\Scripts\python.exe"
            $command = "$work\venv\Scripts\nasa-data-hub.exe"
            $wheel = (Get-ChildItem .\dist\*.whl | Select-Object -First 1).FullName
            & $python -m pip install --disable-pip-version-check --no-deps $wheel
            & $command --env-file "$work\missing.env" health | Set-Content "$work\health.json"
            & $python .\scripts\reliability_probe.py
            $health = Get-Content "$work\health.json" -Raw | ConvertFrom-Json
            if (-not $health.ok -or $health.key_mode -ne 'demo' -or -not $health.using_demo_key) {
              throw "Health validation failed on Windows phase 1 pass $pass"
            }
            Remove-Item $work, .\dist -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'WINDOWS PHASE 1 RESULT: 10/10 PASSED'

      - name: Phase 2 — ten confirmation Windows passes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          1..10 | ForEach-Object {
            $pass = $_
            Write-Host "========== WINDOWS PHASE 2 PASS $pass/10 =========="
            $work = Join-Path $env:TEMP "nasa-win-phase2-$pass"
            Remove-Item $work, .\dist -Recurse -Force -ErrorAction SilentlyContinue
            python -m compileall -q nasa_data_hub
            python -m unittest discover -s tests -v
            [void][scriptblock]::Create((Get-Content .\start.ps1 -Raw))
            python -m pip wheel . --no-deps --no-build-isolation -w dist
            python -m venv "$work\venv"
            $python = "$work\venv\Scripts\python.exe"
            $command = "$work\venv\Scripts\nasa-data-hub.exe"
            $wheel = (Get-ChildItem .\dist\*.whl | Select-Object -First 1).FullName
            & $python -m pip install --disable-pip-version-check --no-deps $wheel
            & $command --env-file "$work\missing.env" health | Set-Content "$work\health.json"
            & $python .\scripts\reliability_probe.py
            $health = Get-Content "$work\health.json" -Raw | ConvertFrom-Json
            if (-not $health.ok -or $health.key_mode -ne 'demo' -or -not $health.using_demo_key) {
              throw "Health validation failed on Windows phase 2 pass $pass"
            }
            Remove-Item $work, .\dist -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'WINDOWS PHASE 2 RESULT: 10/10 PASSED'
