name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q nasa_data_hub
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify no-key health path
        run: python -m nasa_data_hub --env-file /tmp/missing-nasa-env health
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check "setuptools>=68" wheel
          python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Install and verify wheel
        shell: bash
        run: |
          python -m venv verify-env
          verify-env/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          verify-env/bin/nasa-data-hub --env-file /tmp/missing-nasa-env health
