experiment:
  name: first_drop
  purpose: >-
    Compare an uncontrolled vortex trajectory with an adaptive redistribution
    controller while tracking boundedness, continued flow, temperature, and
    preservation of an essential marked substance X.

lane:
  pure_navier_stokes_baseline: true
  controlled_space_extension: true
  metamorphosis_extensions: false

fluid:
  density: 1.0
  kinematic_viscosity: 0.001
  heat_capacity: 1.0
  thermal_conductivity: 0.001
  reference_temperature: 0.0

geometry:
  dimensions: 2
  domain: unit_square
  boundary_condition: no_slip

initial_condition:
  type: single_vortex
  amplitude: 1.0
  marked_scalar:
    enabled: true
    shape: centred_drop

thermal:
  enabled: false
  exterior_temperature: 0.0
  heat_transfer_coefficient: 0.0

controller:
  enabled: true
  type: vorticity_negative_feedback
  safe_vorticity: 10.0
  proportional_gain: 0.1
  max_control_force: 1.0

metrics:
  track:
    - max_velocity_gradient
    - max_vorticity
    - kinetic_energy
    - concentration_rate
    - redistribution_rate
    - regulation_ratio
    - preservation_score
  require_continued_flow_after_peak: true

preservation:
  essential_fields:
    - essential_matter
    - composition
    - structure
    - information
    - function
  existence_threshold: 0.90

validation:
  require_baseline_comparison: true
  require_independent_solver_comparison: true
  allow_pinn_as_only_evidence: false
