name: Format and verify NASA redaction patch

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nasa-response-key-redaction-20260803
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply repository formatter
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff format apps/nasa_data_hub/nasa_data_hub/client.py apps/nasa_data_hub/tests/test_client.py
          ruff check apps/nasa_data_hub/nasa_data_hub/client.py apps/nasa_data_hub/tests/test_client.py
      - name: Verify standalone suite
        working-directory: apps/nasa_data_hub
        run: |
          python -m compileall -q nasa_data_hub
          python -m unittest discover -s tests -v
      - name: Commit formatted verified source
        run: |
          rm .github/workflows/format-nasa-redaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nasa_data_hub/nasa_data_hub/client.py apps/nasa_data_hub/tests/test_client.py .github/workflows/format-nasa-redaction.yml
          git commit -m "style: format NASA key-redaction regression test"
          git push origin HEAD:fix/nasa-response-key-redaction-20260803
