name: Fifteen consecutive verification passes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} 15/15 clean-package cycles
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install wheel prerequisites
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel
      - name: Run fifteen uninterrupted cycles
        run: python scripts/reliability_gate.py --phase 1 --passes 15
