name: NASA Data Hub 20-pass reliability

on:
  push:
    branches: [master]
    paths:
      - "apps/nasa_data_hub/**"
      - ".github/workflows/nasa-20-pass-reliability.yml"
  pull_request:
    paths:
      - "apps/nasa_data_hub/**"
      - ".github/workflows/nasa-20-pass-reliability.yml"
  workflow_dispatch:
    inputs:
      run_registered_live_soak:
        description: "Run the registered-key NASA API 10+10 live soak"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-reliability:
    name: Linux 10-pass + 10-pass confirmation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY || 'DEMO_KEY' }}
      NASA_TIMEOUT_SECONDS: "30"
      NASA_MAX_RETRIES: "3"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel

      - name: Quota-safe preflight external check
        run: python scripts/live_probe.py --passes 1 --eonet-only --label preflight

      - name: Registered-key NASA preflight
        run: >-
          python scripts/live_probe.py --passes 1 --require-personal
          --skip-if-demo --label registered-preflight

      - name: Phase 1 — ten complete clean passes
        run: python scripts/reliability_gate.py --phase 1 --passes 10

      - name: Quota-safe midpoint external check
        run: python scripts/live_probe.py --passes 1 --eonet-only --label midpoint

      - name: Registered-key midpoint check
        run: >-
          python scripts/live_probe.py --passes 1 --require-personal
          --skip-if-demo --label registered-midpoint

      - name: Phase 2 — ten confirmation passes
        run: python scripts/reliability_gate.py --phase 2 --passes 10

      - name: Quota-safe postflight external check
        run: python scripts/live_probe.py --passes 1 --eonet-only --label postflight

      - name: Registered-key postflight check
        run: >-
          python scripts/live_probe.py --passes 1 --require-personal
          --skip-if-demo --label registered-postflight

  windows-reliability:
    name: Windows 10-pass + 10-pass confirmation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY || 'DEMO_KEY' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel

      - name: Phase 1 — ten complete clean passes
        run: python scripts/reliability_gate.py --phase 1 --passes 10

      - name: Phase 2 — ten confirmation passes
        run: python scripts/reliability_gate.py --phase 2 --passes 10

  registered-live-soak:
    name: Registered-key live APIs 10-pass + 10-pass confirmation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_registered_live_soak }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nasa_data_hub
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      NASA_TIMEOUT_SECONDS: "30"
      NASA_MAX_RETRIES: "3"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require a rotated registered NASA API key
        shell: bash
        run: |
          if [ -z "${NASA_API_KEY:-}" ] || [ "$NASA_API_KEY" = "DEMO_KEY" ]; then
            echo "::error::A rotated registered NASA_API_KEY repository secret is required for the live 10+10 soak."
            exit 1
          fi

      - name: Live Phase 1 — ten complete API-family passes
        run: >-
          python scripts/live_probe.py --passes 10 --require-personal
          --label live-phase1

      - name: Live Phase 2 — ten API-family confirmation passes
        run: >-
          python scripts/live_probe.py --passes 10 --require-personal
          --label live-phase2
